# HTTPS-vhost. Сертификат выпускает certbot (certonly --webroot), пути — стандартные.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName ai-client-responder.ozzy1986.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/ai-client-responder.ozzy1986.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ai-client-responder.ozzy1986.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Всё — в uvicorn: он отдаёт и API, и статическую страницу. Таймаут больше, чем у LLM (240 с).
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8102/ retry=0 timeout=300
    ProxyPassReverse / http://127.0.0.1:8102/
    RequestHeader set X-Forwarded-Proto "https"

    # Демо открыто, а изменять базу знаний может только автор: POST/PUT/DELETE /api/kb — по паролю.
    # Файл паролей создаёт deploy/setup-server.sh.
    <Location /api/kb>
        <LimitExcept GET HEAD>
            AuthType Basic
            AuthName "AI Client Responder: knowledge base editing"
            AuthUserFile /etc/apache2/acr.htpasswd
            Require valid-user
        </LimitExcept>
    </Location>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    # Swagger UI (/docs) грузит скрипты с jsDelivr и использует inline-скрипт.
    <LocationMatch "^/(docs|redoc)">
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; frame-ancestors 'none'"
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/ai-client-responder_error.log
    CustomLog ${APACHE_LOG_DIR}/ai-client-responder_access.log combined
</VirtualHost>
</IfModule>
