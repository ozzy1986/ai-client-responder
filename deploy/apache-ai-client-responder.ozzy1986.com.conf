# HTTP: только ACME-челлендж certbot и редирект на HTTPS. Конфигурация приложения —
# в apache-ai-client-responder.ozzy1986.com-le-ssl.conf. Оба файла ставит deploy/setup-server.sh.
<VirtualHost *:80>
    ServerName ai-client-responder.ozzy1986.com
    DocumentRoot /var/www/ai-client-responder/acme

    <Directory /var/www/ai-client-responder/acme>
        Require all granted
        Options -Indexes
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://ai-client-responder.ozzy1986.com%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/ai-client-responder_error.log
    CustomLog ${APACHE_LOG_DIR}/ai-client-responder_access.log combined
</VirtualHost>
